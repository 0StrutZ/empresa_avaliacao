<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <title>Cadastro de Filmes</title>
</head>
<body class="min-h-screen bg-gray-100 text-gray-800">
  <main class="max-w-5xl mx-auto px-4 py-8">
    <section class="bg-white rounded-xl shadow p-6">
      <h1 class="text-3xl font-bold text-blue-700 mb-2">Cadastro de Filmes</h1>
      <p class="text-gray-600 mb-6">Cadastre filmes e visualize os lançamentos mais recentes primeiro.</p>

      <form id="formFilme" class="grid gap-4">
        <div>
          <label for="titulo" class="block font-medium mb-1">Título</label>
          <input
            type="text"
            id="titulo"
            placeholder="Digite o título do filme"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
            required
          >
        </div>

        <div>
          <label for="sinopse" class="block font-medium mb-1">Sinopse</label>
          <textarea
            id="sinopse"
            rows="4"
            placeholder="Digite uma breve sinopse"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
            required
          ></textarea>
        </div>

        <div>
          <label for="ano" class="block font-medium mb-1">Ano de lançamento</label>
          <input
            type="number"
            id="ano"
            min="1888"
            max="2100"
            placeholder="Ex.: 2026"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
            required
          >
        </div>

        <button
          type="submit"
          class="bg-blue-600 text-white font-semibold px-4 py-2 rounded-lg hover:bg-blue-700 transition"
        >
          Cadastrar filme
        </button>
      </form>

      <p id="mensagem" class="mt-4 min-h-6 text-sm font-medium" aria-live="polite"></p>
    </section>

    <section class="mt-8">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-2xl font-bold">Filmes cadastrados</h2>
        <span id="contador" class="text-sm text-gray-500">0 filmes</span>
      </div>

      <div id="listaFilmes" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <p id="estadoVazio" class="col-span-full text-gray-500 bg-white rounded-lg p-6 text-center">
          Nenhum filme cadastrado ainda.
        </p>
      </div>
    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
